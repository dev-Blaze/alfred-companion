[versions]
# agp/kotlin/composeBom/lifecycle/activityCompose/coroutines copied from the phone app's
# (alfred/) catalog, already verified current there — see that repo's CLAUDE.md. Wear-specific
# versions (playServicesWearable, wearCompose) confirmed against live sources on 2026-07-01.
agp = "9.2.1"
kotlin = "2.4.0"
composeBom = "2026.06.01"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
fragment = "1.9.0"
coroutines = "1.11.0"
playServicesWearable = "20.0.1"
wearCompose = "1.6.2"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }

junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
# Kotlin compilation is built into AGP 9+; only the standalone compiler plugin is applied here.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
